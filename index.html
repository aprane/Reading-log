<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reading Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #22332B;
    --paper: #F3ECDA;
    --paper-card: #FBF7EC;
    --cloth: #3C5A45;
    --cloth-dark: #2A4132;
    --brass: #B8863F;
    --brass-light: #E4C88A;
    --stamp: #8C3B3B;
    --line: #D8CBA8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    animation: pageIn 0.5s ease both;
  }

  @keyframes pageIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header, ledger style */
  header {
    position: relative;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 24px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
  }

  header::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 1px;
    background: var(--line);
  }

  header h1 {
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 2.4rem;
    margin: 0 0 6px 0;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: #5B6B60;
    font-size: 0.95rem;
    max-width: 40ch;
  }

  .count {
    font-family: 'Lora', serif;
    font-size: 0.95rem;
    color: var(--cloth-dark);
    white-space: nowrap;
    padding-bottom: 4px;
    transition: color 0.2s;
  }
  .count strong { font-size: 1.3rem; }

  /* Genre tabs */
  .tabs {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    margin-bottom: 32px;
    padding-bottom: 12px;
  }

  .tab {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.92rem;
    color: #6B7A6F;
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .tab:hover { color: var(--ink); transform: translateY(-1px); }

  .tab:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--brass);
    font-weight: 600;
  }

  .genre-group {
    margin-bottom: 34px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .genre-heading {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--cloth-dark);
    margin: 0 0 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }

  /* Card grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .card {
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 14px 12px 12px;
    box-shadow: 1px 2px 0 rgba(34,51,43,0.06);
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    animation: cardIn 0.35s ease both;
  }

  .card .cover {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 2px;
    border: 1px solid var(--line);
    margin-bottom: 2px;
    background: #EFE7D2;
  }

  .card .cover-placeholder {
    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 2px;
    border: 1px solid var(--line);
    margin-bottom: 2px;
    background: linear-gradient(135deg, var(--brass-light), var(--brass));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lora', serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--paper-card);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .grid .card:nth-child(1) { animation-delay: 0.02s; }
  .grid .card:nth-child(2) { animation-delay: 0.06s; }
  .grid .card:nth-child(3) { animation-delay: 0.1s; }
  .grid .card:nth-child(4) { animation-delay: 0.14s; }
  .grid .card:nth-child(5) { animation-delay: 0.18s; }
  .grid .card:nth-child(6) { animation-delay: 0.22s; }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 2px 6px 14px rgba(34,51,43,0.14);
    border-color: var(--brass);
  }

  .card .genre-tag {
    position: absolute;
    top: -8px;
    right: 10px;
    background: var(--brass);
    color: var(--paper-card);
    font-size: 0.64rem;
    padding: 2px 7px;
    border-radius: 2px;
    font-weight: 500;
    letter-spacing: 0.01em;
    box-shadow: 1px 2px 3px rgba(34,51,43,0.18);
    transform: rotate(-2deg);
    transition: transform 0.2s ease;
  }

  .card:hover .genre-tag { transform: rotate(0deg); }

  .card h3 {
    font-family: 'Lora', serif;
    font-size: 0.95rem;
    font-weight: 600;
    margin: 4px 0 0;
    line-height: 1.25;
  }

  .card .author {
    font-style: italic;
    color: #5B6B60;
    font-size: 0.78rem;
    margin: 0;
  }

  .card .meta {
    margin-top: 4px;
    font-size: 0.72rem;
    color: #7C8A80;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stars {
    color: var(--brass);
    letter-spacing: 1px;
  }

  .summary-toggle {
    background: none;
    border: none;
    padding: 0;
    margin-top: 1px;
    align-self: flex-start;
    color: var(--cloth-dark);
    font-size: 0.72rem;
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .summary-toggle:hover { color: var(--cloth); }

  .summary-text {
    font-size: 0.78rem;
    color: #5B6B60;
    line-height: 1.45;
    margin: 3px 0 0;
    display: none;
  }
  .summary-text.open { display: block; }

  /* Empty state */
  .empty {
    border: 1px dashed var(--line);
    border-radius: 3px;
    padding: 48px 24px;
    text-align: center;
    color: #6B7A6F;
    animation: fadeIn 0.4s ease both;
  }
  .empty p:first-child {
    font-family: 'Lora', serif;
    font-size: 1.2rem;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .loading-text {
    color: #7C8A80;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @media (max-width: 480px) {
    header h1 { font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My Reading Log</h1>
      <p>Every book I've finished, sorted onto its shelf.</p>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div id="content"></div>
</div>

<script>
  let books = [];
  let activeGenre = 'All';

  const SUPABASE_URL = 'https://xwnemuogbzekxlhjlvvg.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_coGaKWEh9vUrE_9hRoRTkw_fZU-Mp6R';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const contentEl = document.getElementById('content');
  const tabsEl = document.getElementById('tabs');
  const countEl = document.getElementById('count');

  async function loadBooks() {
    contentEl.innerHTML = '<p class="loading-text">Loading your shelf…</p>';
    try {
      const { data, error } = await db.from('books').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      books = data || [];
    } catch (e) {
      console.error('Could not load books', e);
      books = [];
      contentEl.innerHTML = '<div class="empty"><p>Could not reach the database.</p><p>Check your connection and refresh.</p></div>';
      return;
    }
    render();
  }

  function getGenres() {
    const set = new Set(books.map(b => b.genre).filter(Boolean));
    return Array.from(set).sort();
  }

  function render() {
    // tabs
    const genres = getGenres();
    const tabNames = ['All', ...genres];
    tabsEl.innerHTML = tabNames.map(g =>
      `<button class="tab${g === activeGenre ? ' active' : ''}" data-genre="${escapeHtml(g)}">${escapeHtml(g)}${g !== 'All' ? ' (' + books.filter(b => b.genre === g).length + ')' : ''}</button>`
    ).join('');
    tabsEl.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeGenre = btn.dataset.genre;
        render();
      });
    });

    // count
    countEl.innerHTML = `<strong>${books.length}</strong> book${books.length === 1 ? '' : 's'} logged`;

    // cards
    const filtered = activeGenre === 'All' ? books : books.filter(b => b.genre === activeGenre);

    if (filtered.length === 0) {
      contentEl.innerHTML = `
        <div class="empty">
          <p>${books.length === 0 ? "Your shelf is empty." : "No books in this genre yet."}</p>
          <p>${books.length === 0 ? "Add the first book you've read to get started." : "Add one, or pick another tab."}</p>
        </div>`;
      return;
    }

    const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '');

    function cardHtml(b) {
      const initial = (b.title || '?').trim().charAt(0).toUpperCase();
      const coverHtml = b.cover_url
        ? `<img class="cover" src="${escapeHtml(b.cover_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;cover-placeholder&quot;>${initial}</div>'">`
        : `<div class="cover-placeholder">${initial}</div>`;
      return `
      <div class="card" data-id="${b.id}">
        ${b.genre ? `<span class="genre-tag">${escapeHtml(b.genre)}</span>` : ''}
        ${coverHtml}
        <h3>${escapeHtml(b.title)}</h3>
        ${b.author ? `<p class="author">${escapeHtml(b.author)}</p>` : ''}
        <div class="meta">
          <span>${b.date ? formatDate(b.date) : ''}</span>
          <span class="stars">${b.rating ? '★'.repeat(b.rating) : ''}</span>
        </div>
        ${b.summary ? `
          <button class="summary-toggle" data-summary-toggle>Summary</button>
          <p class="summary-text">${escapeHtml(b.summary)}</p>
        ` : ''}
      </div>`;
    }

    if (activeGenre === 'All') {
      const groups = {};
      filtered.forEach(b => {
        const g = b.genre || 'Uncategorized';
        (groups[g] = groups[g] || []).push(b);
      });
      const genreNames = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      contentEl.innerHTML = genreNames.map(g => `
        <section class="genre-group">
          <h2 class="genre-heading">${escapeHtml(g)}</h2>
          <div class="grid">${groups[g].sort(byDateDesc).map(cardHtml).join('')}</div>
        </section>
      `).join('');
    } else {
      const sorted = [...filtered].sort(byDateDesc);
      contentEl.innerHTML = `<div class="grid">${sorted.map(cardHtml).join('')}</div>`;
    }

    contentEl.querySelectorAll('[data-summary-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const card = btn.closest('.card');
        const textEl = card.querySelector('.summary-text');
        const isOpen = textEl.classList.toggle('open');
        btn.textContent = isOpen ? 'Hide summary' : 'Summary';
      });
    });
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadBooks();
</script>
</body>
</html>
